<svg xmlns="http://www.w3.org/2000/svg" width="720" height="104" viewBox="0 0 720 104" fill="none" style="max-width:100%;height:auto"><style>:root{--text:#ECEAE4;--dim:#8b919b;--mute:#6b7280;--gold:#C8A97E;--soft:#E6D2B0;--hair:#232a35}@media (prefers-color-scheme: light){:root{--text:#1f2328;--dim:#59636e;--mute:#818b96;--gold:#9a753f;--soft:#7d5e30;--hair:#d1d9e0}}.t{fill:var(--text)}.d{fill:var(--dim)}.m{fill:var(--mute)}.g{fill:var(--gold)}.s{fill:var(--soft)}.h{fill:var(--hair)}.hb{fill:none;stroke:var(--hair);stroke-width:1}</style><rect x="340" y="22" width="40" height="1" class="g"/><text x="360.0" y="56" text-anchor="middle" font-family="'Georgia','Noto Serif SC','Songti SC',serif" font-size="20" class="t">我造工具，先为自己，也为同样挑剔的人。</text><text x="360.0" y="82" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-style="italic" class="m">Tools I build for myself first — then for people just as picky.</text><rect x="340" y="96" width="40" height="1" class="g"/></svg>