<svg xmlns="http://www.w3.org/2000/svg" width="720" height="106" viewBox="0 0 720 106" fill="none" style="max-width:100%;height:auto"><defs><linearGradient id="barg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--goldhi)"/><stop offset="1" stop-color="var(--gold)"/></linearGradient><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".38"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs><style>:root{--text:#ECEAE4;--dim:#9AA3AE;--mute:#6B7280;--hair:#242C38;--gold:#C8A97E;--goldhi:#DCC096;--soft:#E6D2B0;--seal:#B0413E;--sealink:#F6F1E8;}@media (prefers-color-scheme: light){:root{--text:#1F2328;--dim:#57606A;--mute:#8A94A0;--hair:#D6DCE3;--gold:#8F6B33;--goldhi:#A57E42;--soft:#7D5E30;--seal:#A03A34;--sealink:#FCF8F2;}}.t{fill:var(--text)}.d{fill:var(--dim)}.m{fill:var(--mute)}.g{fill:var(--gold)}.s{fill:var(--soft)}.h{fill:var(--hair)}.hb{fill:none;stroke:var(--hair);stroke-width:1}.seal{fill:var(--seal)}.sealt{fill:var(--sealink)}.gs{fill:var(--gold);opacity:.72}.gd{fill:var(--gold);opacity:.45}.grid{fill:none;stroke:var(--hair);stroke-width:1;stroke-dasharray:2 5}</style><rect x="24" y="31" width="2" height="14" class="g"/><text x="35" y="45" font-family="'Georgia','Songti SC','STSong','Noto Serif SC','Source Han Serif SC','SimSun',serif" font-size="17" class="t">宣言</text><text x="80.0" y="44" font-family="'SFMono-Regular',Consolas,'Cascadia Code','Liberation Mono',monospace" font-size="9" letter-spacing="2.5" class="m">MANIFESTO</text><rect x="24" y="46" width="672" height="1" class="h"/><text x="360.0" y="80" text-anchor="middle" font-family="'Georgia','Songti SC','STSong','Noto Serif SC','Source Han Serif SC','SimSun',serif" font-size="19" class="t">我造工具，先为自己，也为同样挑剔的人。</text><text x="360.0" y="98" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fo